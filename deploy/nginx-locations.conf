# Merge these locations into the existing HTTP(S) server block.
# Keep existing TLS certificates, ACME challenge, security headers and root.
index index.html;
autoindex off;
charset utf-8;

location = /explore.html { return 302 /explore/explore.html$is_args$args; }
location = /film { return 302 /explore/film/$is_args$args; }
location ^~ /film/ { return 302 /explore$request_uri; }

# Geometry blocks are gzip data decoded by the application, not HTTP gzip.
location ~* \.(bin\.gz|zip-part)$ {
    gzip off;
    types { }
    default_type application/octet-stream;
    try_files $uri =404;
}
location ~* \.(mp4|m4a)$ {
    gzip off;
    types { video/mp4 mp4; audio/mp4 m4a; }
    try_files $uri =404;
}
location / { try_files $uri $uri/ =404; }
